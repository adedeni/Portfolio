<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Sheet not found · Olayode Adeshina</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
<meta name="theme-color" content="#0c2638" />
<style>
  :root { --table:#071a29; --paper:#0c2638; --ink:#eaf0f4; --ink-2:#bccbd6; --ink-3:#9db1c0; --line:rgb(234 240 244 / .2); --line-strong:rgb(234 240 244 / .55); --accent:#ff9159; --grid:rgb(234 240 244 / .05); --grid-major:rgb(234 240 244 / .09); }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px 16px; color:var(--ink); font-family: "Archivo", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    background-color:var(--table);
    background-image: linear-gradient(var(--grid-major) 1px, transparent 1px), linear-gradient(90deg, var(--grid-major) 1px, transparent 1px), linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 120px 120px, 120px 120px, 24px 24px, 24px 24px; }
  .sheet { width:100%; max-width:640px; background:var(--paper); border:1px solid var(--line-strong); box-shadow:0 0 0 4px var(--paper), 0 0 0 5px var(--line); }
  .strip { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; border-bottom:1px solid var(--line-strong); padding:8px 20px; }
  .label { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3); }
  .body { padding:32px 20px 28px; }
  .code { font-family: ui-monospace, Menlo, monospace; color:var(--accent); font-size:14px; }
  h1 { font-size:clamp(28px, 6vw, 44px); line-height:1.05; letter-spacing:-.02em; margin:10px 0 12px; font-weight:700; }
  p { color:var(--ink-2); line-height:1.6; margin:0 0 24px; max-width:44ch; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; }
  a.btn { display:inline-flex; align-items:center; min-height:44px; padding:8px 18px; border:1px solid var(--ink); color:var(--ink); text-decoration:none; font-family: ui-monospace, Menlo, monospace; font-size:14px; }
  a.btn.primary { background:var(--accent); border-color:var(--accent); color:#0c2638; }
  a.btn:hover { border-color:var(--accent); }
  a.btn:focus-visible { outline:2px solid #ffb38a; outline-offset:3px; }
</style>
</head>
<body>
  <main class="sheet">
    <div class="strip"><span class="label">Sheet ?? / 08</span><span class="label">Not in this set</span></div>
    <div class="body">
      <span class="code">404</span>
      <h1>This sheet isn't in the drawing set.</h1>
      <p>The page you asked for doesn't exist. It may have moved, or the link may have a typo.</p>
      <div class="actions">
        <a class="btn primary" href="/">Back to the drawing index</a>
        <a class="btn" href="/olayode-adeshina-cv.pdf" download="Olayode-Adeshina-CV.pdf">Download CV</a>
      </div>
    </div>
  </main>
</body>
</html>
