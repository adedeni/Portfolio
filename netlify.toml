[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Old CV URL (linked from the previous site) keeps working.
[[redirects]]
  from = "/assets/olayodeAdeshinaCv.pdf"
  to = "/olayode-adeshina-cv.pdf"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/olayode-adeshina-cv.pdf"
  [headers.values]
    Content-Disposition = "attachment; filename=\"Olayode-Adeshina-CV.pdf\""
